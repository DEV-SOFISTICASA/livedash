name: Robô LiveDash

on:
  schedule:
    - cron: '0 21 * * *'     # 18:00 no Brasil (21:00 UTC)
    - cron: '0 2 * * *'      # 23:00 no Brasil (02:00 UTC do dia seguinte)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: robo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Rodar o robô
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
        run: node robo-servidor.js
