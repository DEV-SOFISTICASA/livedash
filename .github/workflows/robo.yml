name: Robô LiveDash

on:
  workflow_dispatch:           # backup MANUAL ("Run workflow") — o robô oficial roda 24/7
                               # no worker do Render (livedash-robo, passe a cada ~6 min)

# evita rodadas empilhadas se uma demorar
concurrency:
  group: robo-livedash
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: robo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache do navegador Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Rodar o robô
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
        run: node robo-servidor.js
